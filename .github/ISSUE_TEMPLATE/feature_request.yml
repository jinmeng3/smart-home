name: 功能建议
description: 提出新功能或改进建议
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        请先说明「要解决什么问题」，再说明「打算怎么做」，避免只描述实现方案。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前体验有什么痛点？在什么场景下会遇到？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你希望如何解决？是否有替代方案？
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      multiple: true
      options:
        - Agent 对话 / 工具调用
        - 漏斗路由
        - 会话树 / 上下文压缩
        - 审批与风险控制
        - 设备 / 房间
        - 场景 / 自动化
        - 家庭与成员
        - 模型配置
        - 前端界面
        - 文档
        - 其他
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他补充
      description: 参考资料、竞品做法、设计草图等。
    validations:
      required: false
